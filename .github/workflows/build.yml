name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # MongoDB 8 refuses to start on Linux kernels 6.19 to 7.0.13 (SERVER-121912),
    # which ubuntu-latest runs; ubuntu-22.04 is on 6.8
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build CompassPipelineCopier.slnx
      # The tests start MongoDB in a container with Testcontainers
      - run: dotnet test --solution CompassPipelineCopier.slnx --no-build
      # The package release.yml publishes
      - run: dotnet pack src/PipelineCopier --no-build -o artifacts
